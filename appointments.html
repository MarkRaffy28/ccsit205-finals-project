<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Appointments</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4">
  <h3 class="mb-4">🦷 Appointments</h3>

  <!-- Tabs Navigation -->
  <ul class="nav nav-pills" id="appointmentTabs" role="tablist">
    <li class="nav-item">
      <button class="nav-link active" id="book-tab" data-bs-toggle="tab" data-bs-target="#book" type="button">Book</button>
    </li>
    <li class="nav-item">
      <button class="nav-link" id="request-tab" data-bs-toggle="tab" data-bs-target="#request" type="button">Requests</button>
    </li>
    <li class="nav-item">
      <button class="nav-link" id="upcoming-tab" data-bs-toggle="tab" data-bs-target="#upcoming" type="button">Upcoming</button>
    </li>
    <li class="nav-item">
      <button class="nav-link" id="history-tab" data-bs-toggle="tab" data-bs-target="#history" type="button">History</button>
    </li>
  </ul>

  <!-- Tabs Content -->
  <div class="tab-content mt-4" id="appointmentTabsContent">

    <!-- Book Tab -->
    <div class="tab-pane fade show active" id="book" role="tabpanel">
      <div class="card p-4 shadow-sm">
        <h5>Book Appointment</h5>
        <form>
          <div class="mb-3">
            <label class="form-label">Select Service</label>
            <select class="form-select">
              <option>Dental Checkup</option>
              <option>Tooth Extraction</option>
              <option>Teeth Whitening</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Select Date</label>
            <input type="date" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label">Preferred Time</label>
            <input type="time" class="form-control">
          </div>
          <button type="submit" class="btn btn-primary w-100">Book Now</button>
        </form>
      </div>
    </div>

    <!-- Request Status Tab -->
    <div class="tab-pane fade" id="request" role="tabpanel">
      <div class="card p-4 shadow-sm">
        <h5>Request Status</h5>
        <table class="table table-striped">
          <thead>
            <tr>
              <th>Service</th>
              <th>Date</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
            <tr><td>Checkup</td><td>Nov 10, 2025</td><td><span class="badge bg-warning">Pending</span></td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Upcoming Tab -->
    <div class="tab-pane fade" id="upcoming" role="tabpanel">
      <div class="card p-4 shadow-sm">
        <h5>Upcoming Appointments</h5>
        <div class="list-group">
          <div class="list-group-item d-flex justify-content-between align-items-center">
            <div>
              <strong>Braces Adjustment</strong><br>
              <small>Nov 15, 2025 • 2:00 PM</small>
            </div>
            <button class="btn btn-outline-danger btn-sm">Cancel</button>
          </div>
        </div>
      </div>
    </div>

    <!-- History Tab -->
    <div class="tab-pane fade" id="history" role="tabpanel">
      <div class="card p-4 shadow-sm">
        <h5>Appointment History</h5>
        <table class="table table-bordered table-sm">
          <thead class="table-light">
            <tr>
              <th>Service</th>
              <th>Date</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
            <tr><td>Cleaning</td><td>Oct 20, 2025</td><td><span class="badge bg-success">Completed</span></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
